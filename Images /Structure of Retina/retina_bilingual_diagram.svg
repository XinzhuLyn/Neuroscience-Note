<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fa"/>
    </linearGradient>
    <marker id="arrowGold" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#d49b18"/>
    </marker>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#2878b5"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#31506b" flood-opacity="0.16"/>
    </filter>
    <style>
      .title{font:700 40px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#17324d}
      .subtitle{font:400 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#587087}
      .layer-cn{font:700 21px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#17324d}
      .layer-en{font:500 15px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#526a80}
      .cell-cn{font:700 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#183047}
      .cell-en{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#4f667b}
      .small{font:500 15px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#405a70}
      .dir{font:700 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif}
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#bg)"/>
  <text x="800" y="58" text-anchor="middle" class="title">视网膜细胞与层级结构｜Retinal Cells &amp; Layers</text>
  <text x="800" y="90" text-anchor="middle" class="subtitle">光从玻璃体侧进入；主要神经信号向神经节细胞方向传递</text>

  <!-- orientation -->
  <rect x="32" y="125" width="190" height="885" rx="24" fill="#ffffff" stroke="#d8e3ec" filter="url(#shadow)"/>
  <text x="127" y="165" text-anchor="middle" class="layer-cn">外侧</text>
  <text x="127" y="189" text-anchor="middle" class="layer-en">Outer retina</text>
  <text x="127" y="226" text-anchor="middle" class="small">脉络膜／色素上皮侧</text>
  <text x="127" y="248" text-anchor="middle" class="layer-en">Choroid / RPE side</text>
  <line x1="86" y1="300" x2="86" y2="850" stroke="#d49b18" stroke-width="7" marker-end="url(#arrowGold)"/>
  <text x="109" y="565" transform="rotate(90 109 565)" text-anchor="middle" class="dir" fill="#a97000">光传播方向 Light</text>
  <line x1="169" y1="850" x2="169" y2="300" stroke="#2878b5" stroke-width="7" marker-end="url(#arrowBlue)"/>
  <text x="146" y="565" transform="rotate(-90 146 565)" text-anchor="middle" class="dir" fill="#246a9e">主要信号方向 Signal</text>
  <text x="127" y="934" text-anchor="middle" class="layer-cn">内侧</text>
  <text x="127" y="958" text-anchor="middle" class="layer-en">Inner retina</text>
  <text x="127" y="988" text-anchor="middle" class="small">玻璃体侧 Vitreous</text>

  <!-- layer bands -->
  <g filter="url(#shadow)">
    <rect x="270" y="125" width="1285" height="110" rx="18" fill="#f7e8a8"/>
    <rect x="270" y="245" width="1285" height="135" rx="18" fill="#e7c976"/>
    <rect x="270" y="390" width="1285" height="105" rx="18" fill="#f4c8a6"/>
    <rect x="270" y="505" width="1285" height="175" rx="18" fill="#bde4dc"/>
    <rect x="270" y="690" width="1285" height="125" rx="18" fill="#c8d9f2"/>
    <rect x="270" y="825" width="1285" height="125" rx="18" fill="#d5c8ed"/>
    <rect x="270" y="960" width="1285" height="70" rx="18" fill="#bac8df"/>
  </g>

  <!-- layer labels -->
  <g>
    <text x="300" y="161" class="layer-cn">光感受器外段／内段</text><text x="300" y="187" class="layer-en">Photoreceptor outer &amp; inner segments</text>
    <text x="300" y="285" class="layer-cn">外核层</text><text x="300" y="311" class="layer-en">Outer nuclear layer (ONL)</text>
    <text x="300" y="426" class="layer-cn">外网状层</text><text x="300" y="452" class="layer-en">Outer plexiform layer (OPL)</text>
    <text x="300" y="545" class="layer-cn">内核层</text><text x="300" y="571" class="layer-en">Inner nuclear layer (INL)</text>
    <text x="300" y="729" class="layer-cn">内网状层</text><text x="300" y="755" class="layer-en">Inner plexiform layer (IPL)</text>
    <text x="300" y="866" class="layer-cn">神经节细胞层</text><text x="300" y="892" class="layer-en">Ganglion cell layer (GCL)</text>
    <text x="300" y="993" class="layer-cn">神经纤维层</text><text x="300" y="1018" class="layer-en">Nerve fiber layer (NFL)</text>
  </g>

  <!-- photoreceptors -->
  <g stroke="#704f20" stroke-width="4">
    <!-- rod -->
    <rect x="630" y="142" width="42" height="89" rx="18" fill="#8057a5" stroke="#5d3b7c"/>
    <line x1="651" y1="231" x2="651" y2="273"/>
    <circle cx="651" cy="310" r="30" fill="#936bb6" stroke="#5d3b7c"/>
    <line x1="651" y1="340" x2="651" y2="410"/>
    <path d="M626 410 Q651 430 676 410" fill="#a87dc5" stroke="#5d3b7c"/>
    <!-- cone -->
    <path d="M805 142 L848 142 L840 231 L813 231 Z" fill="#e0655b" stroke="#a43f39"/>
    <line x1="826" y1="231" x2="826" y2="273" stroke="#a43f39"/>
    <circle cx="826" cy="310" r="30" fill="#ee7c70" stroke="#a43f39"/>
    <line x1="826" y1="340" x2="826" y2="410" stroke="#a43f39"/>
    <path d="M797 410 Q826 436 855 410" fill="#f09589" stroke="#a43f39"/>
  </g>
  <text x="651" y="112" text-anchor="middle" class="cell-cn">视杆细胞</text><text x="651" y="132" text-anchor="middle" class="cell-en">Rod</text>
  <text x="826" y="112" text-anchor="middle" class="cell-cn">视锥细胞</text><text x="826" y="132" text-anchor="middle" class="cell-en">Cone</text>

  <!-- horizontal cell in OPL/INL -->
  <g stroke="#278d7d" stroke-width="5" fill="none">
    <line x1="560" y1="454" x2="1000" y2="454"/>
    <line x1="650" y1="454" x2="650" y2="425"/>
    <line x1="826" y1="454" x2="826" y2="425"/>
    <line x1="960" y1="454" x2="960" y2="425"/>
  </g>
  <ellipse cx="1040" cy="454" rx="42" ry="25" fill="#45aa98" stroke="#278d7d" stroke-width="4"/>
  <line x1="1040" y1="479" x2="1040" y2="548" stroke="#278d7d" stroke-width="5"/>
  <text x="1110" y="445" class="cell-cn">水平细胞</text><text x="1110" y="469" class="cell-en">Horizontal cell</text>

  <!-- bipolar cells -->
  <g stroke="#2878b5" stroke-width="5" fill="none">
    <line x1="740" y1="429" x2="740" y2="536"/>
    <circle cx="740" cy="586" r="40" fill="#55a7d8" stroke="#2878b5"/>
    <line x1="740" y1="626" x2="740" y2="737"/>
    <path d="M710 737 Q740 765 770 737" fill="#78bee3"/>
  </g>
  <text x="790" y="577" class="cell-cn">双极细胞</text><text x="790" y="601" class="cell-en">Bipolar cell</text>

  <!-- amacrine -->
  <g stroke="#ce7e20" stroke-width="5" fill="none">
    <circle cx="1060" cy="626" r="38" fill="#f0aa51" stroke="#ce7e20"/>
    <line x1="1060" y1="664" x2="1060" y2="753"/>
    <line x1="900" y1="753" x2="1220" y2="753"/>
    <line x1="930" y1="753" x2="930" y2="780"/>
    <line x1="1100" y1="753" x2="1100" y2="780"/>
  </g>
  <text x="1120" y="620" class="cell-cn">无长突细胞</text><text x="1120" y="644" class="cell-en">Amacrine cell</text>

  <!-- ganglion -->
  <g stroke="#5b4aa0" stroke-width="5" fill="none">
    <path d="M740 797 L700 842 M740 797 L780 842 M740 797 L740 842"/>
    <circle cx="740" cy="886" r="43" fill="#8171c2" stroke="#5b4aa0"/>
    <line x1="740" y1="929" x2="740" y2="995"/>
    <line x1="740" y1="995" x2="1440" y2="995" marker-end="url(#arrowBlue)"/>
  </g>
  <text x="800" y="880" class="cell-cn">神经节细胞</text><text x="800" y="905" class="cell-en">Ganglion cell</text>
  <text x="1250" y="979" class="small">轴突汇成视神经</text><text x="1250" y="1015" class="layer-en">Axons form the optic nerve</text>

  <!-- synapse labels -->
  <rect x="1220" y="401" width="300" height="76" rx="14" fill="#fff" opacity="0.88"/>
  <text x="1240" y="429" class="small">光感受器 ↔ 双极／水平细胞</text>
  <text x="1240" y="454" class="layer-en">Photoreceptor ↔ bipolar / horizontal</text>
  <rect x="1220" y="704" width="300" height="76" rx="14" fill="#fff" opacity="0.88"/>
  <text x="1240" y="732" class="small">双极 ↔ 神经节／无长突细胞</text>
  <text x="1240" y="757" class="layer-en">Bipolar ↔ ganglion / amacrine</text>

  <!-- legend -->
  <rect x="270" y="1052" width="1285" height="48" rx="14" fill="#ffffff" stroke="#d8e3ec"/>
  <text x="292" y="1083" class="small">纵向通路：光感受器 → 双极细胞 → 神经节细胞　｜　横向调节：水平细胞（外网状层）＋ 无长突细胞（内网状层）</text>
</svg>
