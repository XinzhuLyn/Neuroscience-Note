<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 720" font-family="'Segoe UI', Arial, sans-serif">
  
  <rect width="860" height="720" fill="#fafafa" rx="8"/>
  
  <!-- 标题 -->
  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">视网膜细胞层级结构</text>
  <text x="430" y="52" text-anchor="middle" font-size="13" fill="#666">Retinal Cell Layer Structure</text>
  
  <!-- 光线方向 -->
  <text x="430" y="78" text-anchor="middle" font-size="11" fill="#bbb">▲ 光线方向 Light Direction</text>
  
  <!-- ======== 第1层：RPE ======== -->
  <rect x="60" y="92" width="740" height="42" fill="#2b2d42" rx="5"/>
  <text x="430" y="111" text-anchor="middle" font-size="14" font-weight="bold" fill="#edf2f4">视网膜色素上皮</text>
  <text x="430" y="128" text-anchor="middle" font-size="11" fill="#8d99ae">Retinal Pigment Epithelium (RPE)</text>
  
  <!-- ======== 第2层：光感受器层 ======== -->
  <rect x="60" y="144" width="740" height="80" fill="#e9c46a" rx="5" opacity="0.2"/>
  
  <!-- 视锥 -->
  <rect x="160" y="157" width="16" height="55" fill="#f4a261" rx="2"/>
  <ellipse cx="168" cy="157" rx="10" ry="6" fill="#e76f51"/>
  <text x="168" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#e76f51">视锥细胞</text>
  <text x="168" y="248" text-anchor="middle" font-size="10" fill="#e76f51">Cone</text>
  
  <!-- 视杆 -->
  <rect x="380" y="157" width="14" height="55" fill="#264653" rx="2"/>
  <ellipse cx="387" cy="157" rx="9" ry="6" fill="#2a9d8f"/>
  <text x="387" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#264653">视杆细胞</text>
  <text x="387" y="248" text-anchor="middle" font-size="10" fill="#264653">Rod</text>
  
  <!-- 额外示意 -->
  <rect x="570" y="159" width="14" height="50" fill="#f4a261" rx="2"/>
  <ellipse cx="577" cy="159" rx="9" ry="5" fill="#e76f51"/>
  <text x="577" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#e76f51">视锥细胞</text>
  <text x="577" y="248" text-anchor="middle" font-size="10" fill="#e76f51">Cone</text>
  
  <rect x="720" y="159" width="14" height="50" fill="#264653" rx="2"/>
  <ellipse cx="727" cy="159" rx="9" ry="5" fill="#2a9d8f"/>
  <text x="727" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#264653">视杆细胞</text>
  <text x="727" y="248" text-anchor="middle" font-size="10" fill="#264653">Rod</text>
  
  <text x="430" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">光感受器层 Photoreceptor Layer</text>
  
  <!-- ======== 第3层：ONL + OPL ======== -->
  <rect x="60" y="280" width="740" height="32" fill="#a8dadc" rx="5" opacity="0.5"/>
  <text x="430" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d3557">外核层 Outer Nuclear Layer (ONL)</text>
  <text x="430" y="308" text-anchor="middle" font-size="10" fill="#1d3557">光感受器细胞核</text>
  
  <rect x="60" y="316" width="740" height="18" fill="#457b9d" rx="3" opacity="0.2"/>
  <text x="430" y="329" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d3557">外网状层 Outer Plexiform Layer (OPL)</text>
  
  <!-- ======== 第4层：INL ======== -->
  <rect x="60" y="344" width="740" height="90" fill="#a8dadc" rx="5" opacity="0.15"/>
  
  <!-- 水平细胞 -->
  <ellipse cx="180" cy="377" rx="26" ry="13" fill="#e5989b" stroke="#b56576" stroke-width="1.5"/>
  <text x="180" y="372" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d2e3f">水平细胞</text>
  <text x="180" y="385" text-anchor="middle" font-size="9" fill="#6d2e3f">Horizontal</text>
  
  <!-- 双极细胞 -->
  <rect x="370" y="362" width="12" height="50" fill="#6d6875" rx="2"/>
  <ellipse cx="376" cy="362" rx="10" ry="6" fill="#4a4e69"/>
  <text x="376" y="430" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a4e69">双极细胞</text>
  <text x="376" y="442" text-anchor="middle" font-size="9" fill="#4a4e69">Bipolar</text>
  
  <!-- 无长突细胞 -->
  <ellipse cx="600" cy="392" rx="22" ry="12" fill="#b5838d" stroke="#9d4e6e" stroke-width="1.5"/>
  <text x="600" y="378" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d2e3f">无长突细胞</text>
  <text x="600" y="392" text-anchor="middle" font-size="9" fill="#6d2e3f">Amacrine</text>
  
  <text x="430" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">内核层 Inner Nuclear Layer (INL)</text>
  
  <!-- ======== 第5层：IPL ======== -->
  <rect x="60" y="462" width="740" height="18" fill="#457b9d" rx="3" opacity="0.2"/>
  <text x="430" y="475" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d3557">内网状层 Inner Plexiform Layer (IPL)</text>
  
  <!-- ======== 第6层：GCL ======== -->
  <rect x="60" y="490" width="740" height="60" fill="#e5989b" rx="5" opacity="0.2"/>
  
  <ellipse cx="430" cy="520" rx="24" ry="14" fill="#b56576" stroke="#6d2e3f" stroke-width="2"/>
  <text x="430" y="515" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">神经节细胞</text>
  <text x="430" y="528" text-anchor="middle" font-size="10" fill="#fff">Ganglion</text>
  
  <!-- 轴突 -->
  <line x1="430" y1="534" x2="430" y2="565" stroke="#6d2e3f" stroke-width="2.5"/>
  <line x1="430" y1="565" x2="430" y2="600" stroke="#6d2e3f" stroke-width="2.5"/>
  <text x="448" y="593" font-size="9" fill="#6d2e3f">轴突 → 视神经</text>
  <text x="448" y="605" font-size="9" fill="#6d2e3f">Axon → Optic Nerve</text>
  
  <text x="430" y="568" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">神经节细胞层 Ganglion Cell Layer (GCL)</text>
  
  <!-- ======== 图例 ======== -->
  <rect x="60" y="640" width="740" height="45" fill="#f0f0f0" rx="6" stroke="#ddd" stroke-width="1"/>
  <text x="80" y="660" font-size="11" font-weight="bold" fill="#555">图例：</text>
  
  <ellipse cx="140" cy="662" rx="10" ry="5" fill="#f4a261"/>
  <text x="155" y="666" font-size="10" fill="#333">视锥 Cone</text>
  
  <ellipse cx="260" cy="662" rx="10" ry="5" fill="#2a9d8f"/>
  <text x="275" y="666" font-size="10" fill="#333">视杆 Rod</text>
  
  <ellipse cx="380" cy="662" rx="10" ry="5" fill="#6d6875"/>
  <text x="395" y="666" font-size="10" fill="#333">双极 Bipolar</text>
  
  <ellipse cx="510" cy="662" rx="10" ry="5" fill="#e5989b"/>
  <text x="525" y="666" font-size="10" fill="#333">水平 Horizontal</text>
  
  <ellipse cx="640" cy="662" rx="10" ry="5" fill="#b5838d"/>
  <text x="655" y="666" font-size="10" fill="#333">无长突 Amacrine</text>
  
  <ellipse cx="770" cy="662" rx="10" ry="5" fill="#b56576"/>
  <text x="785" y="666" font-size="10" fill="#333">神经节 Ganglion</text>

</svg>
